{{define "cheatsheet.html"}}
<div id="codeHelperDrawer" class="rf-code-helper" aria-hidden="true" data-open="false">
  <div class="rf-code-helper__overlay" data-code-helper-close></div>
  <aside
    class="rf-code-helper__panel"
    role="dialog"
    aria-modal="false"
    aria-labelledby="codeHelperTitle"
  >
    <div class="rf-code-helper__header">
      <div>
        <div class="rf-code-helper__eyebrow">Code Helper</div>
        <h3 id="codeHelperTitle" class="rf-code-helper__title">Reference and Docs</h3>
      </div>
      <sl-icon-button name="x-lg" label="Close helper" data-code-helper-close></sl-icon-button>
    </div>

    <div class="rf-code-helper__search">
      <sl-input
        id="codeHelperSearch"
        size="small"
        clearable
        placeholder="Search env vars, helpers, snippets, docs"
      >
        <sl-icon slot="prefix" name="search"></sl-icon>
      </sl-input>
      <div id="codeHelperBadges" class="rf-code-helper__badges"></div>
    </div>

    <sl-tab-group id="codeHelperTabs" class="rf-code-helper__tabs">
      <sl-tab slot="nav" panel="reference">Reference</sl-tab>
      <sl-tab slot="nav" panel="search">Search</sl-tab>
      <sl-tab slot="nav" panel="docs">Docs</sl-tab>

      <sl-tab-panel name="reference" class="rf-code-helper__tab-panel">
        <div class="rf-code-helper__section">
          <div class="rf-code-helper__section-title">Quick refs</div>
          <div id="codeHelperQuickRefs" class="rf-code-helper__stack"></div>
        </div>
        <div class="rf-code-helper__section">
          <div class="rf-code-helper__section-title">Reference library</div>
          <div id="codeHelperReferenceSections" class="rf-code-helper__stack"></div>
        </div>
      </sl-tab-panel>

      <sl-tab-panel name="search" class="rf-code-helper__tab-panel">
        <div id="codeHelperSearchState" class="rf-code-helper__empty-state">
          Start typing to search RapidForge helpers and docs sources.
        </div>
        <div id="codeHelperSearchResults" class="rf-code-helper__stack"></div>
      </sl-tab-panel>

      <sl-tab-panel name="docs" class="rf-code-helper__tab-panel">
        <div class="rf-code-helper__section">
          <div class="rf-code-helper__section-title">Docs sources</div>
          <div id="codeHelperDocsSources" class="rf-code-helper__stack"></div>
        </div>
      </sl-tab-panel>
    </sl-tab-group>
  </aside>
</div>
{{end}}
