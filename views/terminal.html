{{define "content.html"}}

    <div id="terminal"></div>

    <script src="/static/javascript/xterm.5.5.0.js"></script>

    <script>
        const term = new Terminal();
        term.open(document.getElementById('terminal'));

        const socket = new WebSocket("/terminal");

        term.onData(data => {
            socket.send(data);
        });

        socket.onmessage = (event) => {
            term.write(event.data);
        };

        term.resize(100, 50);

        function notifyResize() {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "resize",
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        // Listen for browser window resize events
        let resizeTimeout;
        window.addEventListener('resize', () => {
            // Debounce resize events to avoid flooding the server
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // Calculate new terminal size based on container
                const container = document.getElementById('terminal');
                const charWidth = 9; // approximate character width in pixels
                const charHeight = 17; // approximate character height in pixels

                const cols = Math.floor(container.clientWidth / charWidth);
                const rows = Math.floor(container.clientHeight / charHeight);

                if (cols > 0 && rows > 0 && (cols !== term.cols || rows !== term.rows)) {
                    term.resize(cols, rows);
                    notifyResize();
                }
            }, 100);
        });

        // Send initial size once connection is open
        socket.addEventListener('open', () => {
            notifyResize();
        });
    </script>

{{end}}
